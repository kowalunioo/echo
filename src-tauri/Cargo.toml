[package]
name = "echo"
version = "0.1.0"
description = "Private, local dictation for Windows"
authors = ["Jakub Kowalski"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "echo_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2.8"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
hound = "3.5"
rubato = "5"
sys-locale = "0.3"
# tauri-specta and specta are pre-1.0 release candidates whose generated output
# changes between releases, so they are pinned exactly.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# The Engine (ADR 0003). Pre-1.0, so pinned to a minor line; its native library is built from
# source with CMake. Default features are off to drop Metal (Apple only); GPU support comes from
# Echo's own `vulkan` feature below.
transcribe-cpp = { version = "0.3.1", default-features = false }
# Model downloads (`models.md`). TLS through Windows' own Schannel (native-tls), so no extra
# crypto library is compiled in; the system proxy is honoured like any Windows app.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[features]
# Vulkan GPU acceleration with automatic CPU fallback (`docs/specs/models.md` rule 29). On by
# default so every app build ships it; it needs the Vulkan SDK at build time. CI builds with
# `--no-default-features` (CPU only): the runner has no GPU and Echo's own code is identical
# either way — the feature only changes which backends the native library compiles in.
default = ["vulkan"]
vulkan = ["transcribe-cpp/vulkan"]

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
# Audio resampling is unbearably slow unoptimised, even in tests.
opt-level = 2
