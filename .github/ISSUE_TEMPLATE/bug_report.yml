name: Bug report
description: Something in Echo doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what Echo did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Echo version
      description: For example from the installer's file name.
      placeholder: "0.9.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "NVIDIA RTX 4070 / AMD Radeon 780M / CPU only"
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Whisper large-v3-turbo
        - Parakeet TDT 0.6B v3
        - Whisper small
        - Not sure
  - type: input
    id: language
    attributes:
      label: Dictation Language
      placeholder: "Auto-detect / Polish / English / …"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from Echo's log. Do not paste Transcripts you'd rather keep private.
      render: text
