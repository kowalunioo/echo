name: Release

# Pushing a tag vX.Y.Z (made by the release flow after `bun run bump`) builds the signed NSIS
# installer and publishes it with its signature and the updater manifest (`latest.json`) as a
# GitHub Release. Installed Echos read that manifest (`docs/specs/updater.md` rule 1).
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # The native Vulkan build (default `vulkan` feature) breaks on long paths, so the target
      # directory is short: `<workspace>\..\t` (D:\a\echo\t). It sits on the workspace drive
      # because Swatinem/rust-cache only takes a target relative to the Cargo workspace. Keep it
      # the same as in release-cache.yml, which warms this cache.
      - name: Use a short target directory
        shell: pwsh
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "t"
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # package.json, tauri.conf.json, Cargo.toml and Cargo.lock must all carry the tag's version.
      - name: Check the tag matches the app version
        id: version
        shell: pwsh
        run: |
          bun scripts/release-check.ts versions $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # A tag run can read caches saved on main but not ones saved on another tag, so this job only
      # restores; release-cache.yml saves the cache on main. The version bump does not change the
      # key: rust-cache ignores the app's own version in Cargo.toml and Cargo.lock.
      - name: Restore the Rust release build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../../t
          shared-key: release-vulkan
          save-if: false

      # Its cache is likewise saved on main by release-cache.yml.
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # `createUpdaterArtifacts` in tauri.conf.json makes the build sign the installer (.sig)
      # with the updater key from these secrets.
      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --bundles nsis

      - name: Write the updater manifest
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $bundle = Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*_${env:VERSION}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "No installer for $env:VERSION in $bundle"; exit 1 }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { Write-Error "Missing $signature"; exit 1 }
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)"
          $platform = @{ signature = (Get-Content $signature -Raw).Trim(); url = $url }
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "Echo $env:VERSION"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64"      = $platform
              "windows-x86_64-nsis" = $platform
            }
          }
          $latest = Join-Path $bundle "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $latest -Encoding utf8NoBOM
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "signature=$signature" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT

      # A wrong TAURI_SIGNING_PRIVATE_KEY secret must fail the release: installed Echos verify
      # updates against the public key in tauri.conf.json and require the signed version.
      - name: Verify the installer's signature
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/release-check.ts signature "${{ steps.assets.outputs.installer }}" "${{ steps.assets.outputs.signature }}" $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "${{ steps.assets.outputs.installer }}" `
            "${{ steps.assets.outputs.signature }}" `
            "${{ steps.assets.outputs.latest }}" `
            --title "Echo $env:VERSION" `
            --generate-notes `
            --verify-tag
