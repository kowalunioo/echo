name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks (Windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # The cargo steps below build without Echo's default `vulkan` feature: the runner has no GPU
      # to exercise it and no Vulkan SDK to build it, and Echo's own Rust code is the same with or
      # without it (the feature only adds the native Vulkan backend). The CPU build still compiles,
      # lints and tests every line of the Engine. Local `bun run check` builds with Vulkan.
      ECHO_CI_CARGO_FEATURES: --no-default-features
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Pull requests restore main's cache but do not save their own: each save is ~1.4 GB,
          # mostly duplicating main's, and they filled the repository's 10 GB cache quota, which
          # evicts main's and the release cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Tauri embeds the built frontend at compile time, so it must exist before cargo runs.
      - name: Build frontend
        run: bun run build

      - name: Prettier
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Vitest
        run: bun run test

      - name: rustfmt
        run: bun run rust:fmt

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets $env:ECHO_CI_CARGO_FEATURES -- -D warnings

      - name: Generated bindings are up to date
        run: cargo test --manifest-path src-tauri/Cargo.toml $env:ECHO_CI_CARGO_FEATURES --lib typescript_bindings_are_up_to_date

      # Audio fixtures are not in the repository; tests that need them skip themselves.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml $env:ECHO_CI_CARGO_FEATURES
